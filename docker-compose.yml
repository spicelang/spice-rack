# Spice Rack: MySQL + the registry app + Caddy as TLS-terminating reverse proxy.
#
#   cp .env.example .env     # fill in the secrets
#   docker compose up -d --build
#
# Caddy obtains and renews the certificate for $DOMAIN automatically; ports 80 and 443 must be reachable.
services:
  db:
    image: mysql:26.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: rack
      MYSQL_USER: rack
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BASE_URL: https://${DOMAIN:-rack.spicelang.com}
      TRUST_PROXY: "1"
      DB_HOST: db
      DB_USER: rack
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: rack
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
    # Not published: only Caddy talks to the app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-rack.spicelang.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
